# The interview route: the order to follow the guide end to end before an
# applied-AI / full-stack interview. Each step names a lesson and what to focus on.
# Rendered at /interview-route. Lesson slugs are checked at build time.

stages:
  - title: "1 · Set the frame"
    goal: Know what the role asks for, how you'll be judged, and the answer shape you'll use everywhere.
    steps:
      - lesson: 00-start-here/02-the-career-map
        focus: The eight responsibilities in a typical applied AI job description.
      - lesson: 12-career-and-interviews/01-the-hiring-process
        focus: Build the JD → proof → questions table; run the consistency audit.
      - lesson: 12-career-and-interviews/05-technical-interview-playbook
        focus: "Principle → implementation → trade-off → proof. Fill the metric-defense table."

  - title: "2 · Your story"
    goal: Say who you are and what you've built, in under 90 seconds, with nothing you can't defend.
    steps:
      - lesson: 12-career-and-interviews/02-your-narrative
        focus: Write and record your introduction three times.
      - lesson: 13-casebook/01-presenting-projects
        focus: Write your best two projects in the eight-part format.
      - lesson: 12-career-and-interviews/03-story-bank
        focus: Eight stories in STAR shape; one lesson line each.

  - title: "3 · Backend core refresh"
    goal: Make sure the fundamentals interviewers use to test seniority are sharp.
    steps:
      - lesson: 03-backend/01-api-design
        focus: Error taxonomy, idempotency keys, cursor pagination.
      - lesson: 03-backend/04-authentication-and-authorization
        focus: IDOR and object-level checks; sessions vs JWT.
      - lesson: 03-backend/06-background-jobs-and-queues
        focus: At-least-once delivery, idempotent jobs, DLQs, never pay twice.
      - lesson: 03-backend/08-resilience-patterns
        focus: Which errors to retry, backoff with jitter, deadlines, breakers.

  - title: "4 · LLM integration"
    goal: Answer "how would you integrate a model into our product?" like an engineer who has shipped it.
    steps:
      - lesson: 07-llm-foundations/03-calling-model-apis
        focus: Q11, Q13, Q14, Q17, Q19. Adapter, stop reasons, structured output.
      - lesson: 07-llm-foundations/04-prompt-engineering
        focus: Q20. Let the model choose; let code compute.
      - lesson: 07-llm-foundations/05-model-selection-cost-latency
        focus: Q15, Q18, Q37, Q38. Cost per successful task.
      - lesson: 07-llm-foundations/06-prompting-rag-or-fine-tuning
        focus: Q40 in one table.

  - title: "5 · RAG"
    goal: Draw a production RAG pipeline and debug it out loud.
    steps:
      - lesson: 08-rag/05-evaluating-and-debugging-rag
        focus: Q1 (12 steps), Q2 (debug table), Q7, Q10.
      - lesson: 08-rag/02-ingestion-and-chunking
        focus: Q3, Q9.
      - lesson: 08-rag/03-hybrid-search-and-reranking
        focus: Q5, Q6, RRF from memory.
      - lesson: 08-rag/04-vector-stores-and-pgvector
        focus: Q4, Q8, the C4 schema.

  - title: "6 · Agents"
    goal: Know when not to build an agent, and how to keep one bounded when you do.
    steps:
      - lesson: 09-agents/01-agents-vs-pipelines
        focus: Q31 and the autonomy spectrum.
      - lesson: 09-agents/02-tool-calling-and-the-agent-loop
        focus: Write the loop; guardrails in the tools.
      - lesson: 09-agents/03-mcp-and-agent-protocols
        focus: Q33.
      - lesson: 09-agents/04-frameworks-and-runtimes
        focus: Q32; what a managed runtime gives you.
      - lesson: 09-agents/06-controlling-agents
        focus: Q34, Q35. Budgets and approvals.

  - title: "7 · Production AI"
    goal: Show you can run AI in production safely, measurably and at a known cost.
    steps:
      - lesson: 10-production-ai/01-reliability-for-llm-calls
        focus: Q12 table, Q16, C1.
      - lesson: 10-production-ai/02-evaluation
        focus: Q21–Q24.
      - lesson: 10-production-ai/03-guardrails-and-prompt-injection
        focus: Q25–Q27. "A system prompt is not a security boundary."
      - lesson: 10-production-ai/04-data-protection-for-ai
        focus: Q28–Q30.
      - lesson: 10-production-ai/05-observability-and-cost
        focus: Q36, the seven-layer dashboard.

  - title: "8 · Design and code"
    goal: Draw a system in 45 minutes and write the core snippets without notes.
    steps:
      - lesson: 06-system-design/02-the-interview-framework
        focus: The seven-step frame and the time plan.
      - lesson: 06-system-design/04-ai-system-design-drills
        focus: Draw D1 in five minutes; name three failure modes.
      - lesson: 14-reference/04-code-kit
        focus: Type C1 and C2 from a blank file.
      - lesson: 01-foundations/06-data-structures-and-algorithms
        focus: The coding-round protocol; one problem per pattern.

  - title: "9 · Final run"
    goal: Rehearse, research, and walk in prepared.
    steps:
      - lesson: 14-reference/01-question-bank
        focus: Five random questions, out loud, scored 0/1/2.
      - lesson: 12-career-and-interviews/06-researching-companies-and-asking-questions
        focus: One-page company brief; three questions.
      - lesson: 12-career-and-interviews/04-behavioral-and-culture
        focus: Values → evidence table.
      - lesson: 12-career-and-interviews/07-day-of-and-after
        focus: Checklist; write every question down afterwards.
