<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Field guide">
  <title>Field guide</title>
  <defs>
    <clipPath id="fg-tile"><rect width="64" height="64" rx="15"/></clipPath>
    <!-- A hill in cross-section: the long climb from foundations (bottom) to applied AI (the lit summit). -->
    <clipPath id="fg-hill">
      <path d="M-2 55 C10 52 16 44 22 37 C28 30 32 18 39 15 C44 13 47 19 50 26 C54 36 58 47 66 52 V64 H-2 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#fg-tile)">
  <rect width="64" height="64" fill="#17604f"/>
  <g clip-path="url(#fg-hill)">
    <!-- Five strata = five levels, L0 at the bottom; gentle waves like a geological section. -->
    <path d="M0 48.6 C16 47.2 32 50.2 64 47.6 V64 H0 Z" fill="#eef0ea"/>
    <path d="M0 41.2 C16 39.8 32 42.8 64 40.2 V45.9 C32 48.5 16 45.5 0 46.9 Z" fill="#eef0ea" fill-opacity=".8"/>
    <path d="M0 33.8 C16 32.4 32 35.4 64 32.8 V38.5 C32 41.1 16 38.1 0 39.5 Z" fill="#eef0ea" fill-opacity=".6"/>
    <path d="M0 26.4 C16 25 32 28 64 25.4 V31.1 C32 33.7 16 30.7 0 32.1 Z" fill="#eef0ea" fill-opacity=".42"/>
    <path d="M0 0 H64 V23.7 C32 26.3 16 23.3 0 24.7 Z" fill="#e3ad3a"/>
  </g>
  </g>
</svg>
