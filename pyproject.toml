[project]
name = "field-guide-content"
version = "3.0.0"
description = "Content compiler for the engineering field guide: Markdown curriculum to JSON for the Next.js site."
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "markdown>=3.11.4",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff.lint.per-file-ignores]
# Mutant lists quote source lines verbatim (each pattern must match exactly once), so they can't be wrapped.
"tests/mutation/mutants_*.py" = ["E501"]
